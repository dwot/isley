{{ define "common/header.html" }}

<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    {{ if .csrfToken }}<meta name="csrf-token" content="{{ .csrfToken }}">{{ end }}
    <meta name="isley-time-zone" content="{{ instanceZone }}">
    <title>Isley {{ .title }}</title>
    <!-- Bootstrap core CSS -->
    <link href="{{ asset "/static/vendor/bootstrap/bootstrap.min.css" }}" rel="stylesheet">
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="{{ asset "/static/vendor/fontawesome/css/all.min.css" }}">
    <link rel="stylesheet" href="{{ asset "/static/css/isley.css" }}">
    <script src="{{ asset "/static/js/theme.js" }}"></script>
    <script src="{{ asset "/static/js/csrf.js" }}"></script>
    <script src="{{ asset "/static/js/isley-time.js" }}"></script>
    <!-- Harvest weight display units (grams/ounces) -->
    <script src="{{ asset "/static/js/weight-units.js" }}"></script>
    <!-- Reusable autocomplete select widget (loaded early for page scripts) -->
    <script src="{{ asset "/static/js/isley-autocomplete.js" }}"></script>
    <!-- Reusable sortable table arrows (loaded early for page scripts) -->
    <script src="{{ asset "/static/js/isley-sortable-table.js" }}"></script>
    <!-- Shared list/filter helpers: esc, debounce, pluralize, populateFilter, clearFilters, list (loaded early for page scripts) -->
    <script src="{{ asset "/static/js/list-utils.js" }}"></script>
{{ end }}
