{{ define "common/footer.html"}}
</main>

<!-- Footer -->
<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top container">
    <!-- Left Section -->
    <div class="col-md-4 d-flex align-items-center">
        <span class="text-muted">{{ .version }}</span>
    </div>

    <!-- Social Links -->
    <!-- Web Site -->

    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
        <li class="ms-3">
            <a class="text-muted" href="https://isley.dwot.io/" aria-label="{{ .lcl.website }}">
                <i class="fas fa-globe"></i>
            </a>
        </li>
        <li class="ms-3">
            <a class="text-muted" href="https://github.com/dwot/isley" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
        </li>
    </ul>
</footer>



<!-- Toast container (for ui-messages.js) -->
<div id="uiToastContainer" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080; pointer-events: none;"></div>

<!-- Reusable confirmation modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="confirmModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="confirmModalCancel" data-bs-dismiss="modal"></button>
                <button type="button" class="btn btn-danger" id="confirmModalConfirm"></button>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap core JavaScript -->
<script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<!-- UI messages helper (toasts + confirm modal + i18n fetch) -->
<script src="/static/js/ui-messages.js"></script>
<!-- Form UX helpers (submit spinner + inline validation) -->
<script src="/static/js/form-helpers.js"></script>
<!-- Activity metric input helpers -->
<script src="/static/js/activity-metrics.js"></script>
<!-- Accessible focus trapping for all Bootstrap modals -->
<script src="/static/js/focus-trap.js"></script>
<!-- Global modal backdrop cleanup: Bootstrap's backdrop can linger when
     the page reloads while a modal fade-out animation is in progress.
     This listener removes any orphaned backdrops on every modal close. -->
<script nonce="{{ .cspNonce }}">
document.addEventListener("DOMContentLoaded", () => {
    document.addEventListener('hidden.bs.modal', () => {
        document.querySelectorAll('.modal-backdrop').forEach(b => b.remove());
        document.body.classList.remove('modal-open');
        document.body.style.overflow = '';
    });
});
</script>
</body>
</html>

{{ end }}
