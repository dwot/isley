      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [delta]
              properties:
                delta:
                  type: integer
                  description: Seeds added (positive) or taken out (negative); not 0.
                  examples: [-1]
      responses:
        "200":
          description: The strain with its new count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strain"
        "400":
          $ref: "#/components/responses/BadRequest"
