openapi: 3.1.0
info:
  title: Isley API
  version: "1"
  summary: Read and record a grow in Isley.
  description: |
    The Isley API v1. JSON in and out.

    **Auth.** Send an API key as `Authorization: Bearer <key>` (preferred)
    or `X-API-KEY: <key>`. Create keys in Settings → API. Each key has
    scopes: `read`, `write` (includes read), `admin` (includes everything)
    and, separately, `ingest`. A request beyond a key's scopes gets `403`
    with code `insufficient_scope`.

    **Errors.** Every non-2xx response has the body
    `{"error": {"code": "...", "message": "...", "details": {...}}}`.
    `code` is stable; branch on it. `message` is for people.

    **Lists.** `{"items": [...], "next_cursor": "..." | null}`. Pass
    `next_cursor` back as `?cursor=` for the next page; `?limit=` is 1-200,
    default 50.

    **Retries.** Any POST may carry an `Idempotency-Key` header (up to 255
    characters, unique per request you mean to make once). A retry with the
    same key and body within 24 hours gets the first successful response
    again, with `Idempotent-Replayed: true`, instead of logging a second
    watering. The same key with a different body is `409
    idempotency_key_reused`; while the first is still running, `409
    idempotency_key_in_progress`. A failed request frees its key.

    **Time.** Timestamps are RFC 3339 with the offset of the instance's
    time zone (see `GET /instance`). Calendar days (a plant's start day)
    are `YYYY-MM-DD`. Timestamps you send without an offset are read in
    the instance's time zone.
servers:
  - url: /api/v1
security:
  - bearer: []
  - apiKeyHeader: []

paths:
  /instance:
    get:
      operationId: getInstance
      summary: Describe this Isley instance and the calling key
      description: |
        Version, time zone, enabled features, and the scopes of the key
        making the call. Clients use it to adapt, and to check a key.
      tags: [instance]
      x-isley-scope: read
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /statuses:
    get:
      operationId: listStatuses
      summary: List plant statuses
      description: |
        Every status in lifecycle order (Germinating … Success, Dead). The
        set is fixed; use the ids when changing a plant's status. Not
        paginated: all statuses come back, with `next_cursor` null.
      tags: [lookups]
      x-isley-scope: read
      responses:
        "200":
          description: The statuses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /metrics:
    get:
      operationId: listMetrics
      summary: List measurement types
      description: |
        The kinds of measurement that can be recorded on a plant (Height,
        pH, …) with their units. Not paginated.
      tags: [lookups]
      x-isley-scope: read
      responses:
        "200":
          description: The metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /activity-types:
    get:
      operationId: listActivityTypes
      summary: List activity types
      description: |
        The kinds of activity that can be logged on a plant (Water, Feed,
        Note and user-defined ones), with the measurements each asks for.
        Not paginated.
      tags: [lookups]
      x-isley-scope: read
      responses:
        "200":
          description: The activity types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityTypeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /zones:
    get:
      operationId: listZones
      summary: List zones
      description: Grow spaces (tents, rooms, beds), oldest first.
      tags: [zones]
      x-isley-scope: read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of zones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createZone
      summary: Create a zone
      tags: [zones]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-isley-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneCreate"
      responses:
        "201":
          description: The new zone. `Location` is its URL.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /zones/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getZone
      summary: Get a zone with its sensors
      description: The zone, and each of its sensors with its latest reading.
      tags: [zones]
      x-isley-scope: read
      responses:
        "200":
          description: The zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      operationId: updateZone
      summary: Change a zone
      description: |
        Send only the fields to change. `null` clears an optional field
        (sending `leaf_temp_offset_f: null` turns VPD off).
      tags: [zones]
      x-isley-scope: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZonePatch"
      responses:
        "200":
          description: The zone as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteZone
      summary: Delete an empty zone
      description: |
        Only a zone with no plants, sensors or streams can be deleted;
        otherwise the answer is `409` with code `zone_not_empty`. Move or
        delete what is in it first. (The web settings page deletes a zone
        together with its contents; the API deliberately doesn't.)
      tags: [zones]
      x-isley-scope: admin
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /plants:
    get:
      operationId: listPlants
      summary: List plants
      description: |
        Plants in id order, each with its age, status, last watering and
        feeding, flowering and harvest facts. Filters combine with AND.
      tags: [plants]
      x-isley-scope: read
      parameters:
        - name: phase
          in: query
          description: |
            By what the current status means: `growing` (Germinating to
            Flower), `harvested` (Drying, Curing, Success) or `dead`.
          schema:
            type: string
            enum: [growing, harvested, dead]
        - name: status_id
          in: query
          description: By current status (ids from `GET /statuses`).
          schema:
            type: integer
            minimum: 1
        - name: zone_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: strain_id
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of plants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

    post:
      operationId: createPlant
      summary: Create a plant
      description: |
        Creates the plant and its first status entry. `start_date` is Day 1
        of its age. The first status starts at `status_at`, or the start
        of `start_date` in the instance zone.
      tags: [plants]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-isley-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantCreate"
      responses:
        "201":
          description: The new plant. `Location` is its URL.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /plants/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getPlant
      summary: Get a plant in full
      description: |
        The plant with its whole status history, its sensors (linked to it,
        or inherited from its zone) with their latest readings, and its 10
        latest activities and measurements.
      tags: [plants]
      x-isley-scope: read
      responses:
        "200":
          description: The plant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      operationId: updatePlant
      summary: Change a plant
      description: |
        Send only the fields to change. `null` clears `zone_id` or
        `parent_id`. To change status, use `POST /plants/{id}/status`.
      tags: [plants]
      x-isley-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantPatch"
      responses:
        "200":
          description: The plant as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deletePlant
      summary: Delete a plant
      description: |
        Deletes the plant with its history, activities, measurements,
        images and smoke reports. Its clones are kept, without a mother.
      tags: [plants]
      x-isley-scope: admin
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /plants/{id}/sensors:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      operationId: setPlantSensors
      summary: Set the sensors linked to a plant
      description: |
        Replaces the plant's own sensors (a soil probe in its pot) with
        `sensor_ids`, in that order. Sensors the plant inherits from its
        zone aren't affected. `[]` unlinks all.
      tags: [plants]
      x-isley-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sensor_ids]
              properties:
                sensor_ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: The plant as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /plants/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: changePlantStatus
      summary: Move a plant to a status
      description: |
        Adds a status history entry at `at` (default now). If the plant is
        already in that status nothing is added: the answer is `200` with
        `changed: false` and the current entry. Otherwise `201`.
      tags: [plants]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-isley-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status_id]
              properties:
                status_id:
                  type: integer
                at:
                  $ref: "#/components/schemas/TimestampInput"
      responses:
        "200":
          description: Already in that status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusChange"
        "201":
          description: The status changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusChange"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /plants/{id}/status-history:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listStatusHistory
      summary: A plant's status history
      description: Oldest first. Not paginated.
      tags: [plants]
      x-isley-scope: read
      responses:
        "200":
          description: The history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StatusEntry"
                  next_cursor:
                    type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /plants/{id}/status-history/{entry_id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: entry_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateStatusEntry
      summary: Correct a status history entry
      tags: [plants]
      x-isley-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status_id:
                  type: integer
                at:
                  $ref: "#/components/schemas/TimestampInput"
      responses:
        "200":
          description: The entry as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteStatusEntry
      summary: Remove a status history entry
      description: A plant's only entry can't be removed (`409 last_status_entry`).
      tags: [plants]
      x-isley-scope: write
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /plants/{id}/activities:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listPlantActivities
      summary: A plant's activities
      description: Newest first.
      tags: [activities]
      x-isley-scope: read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createActivity
      summary: Log an activity on a plant
      description: |
        Watering, feeding, a note, or any activity type (see
        `GET /activity-types`), with the measurements taken alongside.
        Measurements the activity type marks required must be included.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-isley-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "201":
          description: The activity. `Location` is its URL.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /activities:
    get:
      operationId: listActivities
      summary: The activity log
      description: Activities across plants, newest first unless `order=oldest`.
      tags: [activities]
      x-isley-scope: read
      parameters:
        - name: plant_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: zone_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: activity_type_id
          in: query
          description: One or more, repeated or comma-separated.
          schema:
            type: string
        - name: from
          in: query
          description: First day, inclusive (instance zone).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last day, inclusive (instance zone).
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Text the note contains (any case).
          schema:
            type: string
        - name: order
          in: query
          schema:
            type: string
            enum: [newest, oldest]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of activities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"

  /activities/bulk:
    post:
      operationId: createActivitiesBulk
      summary: Log one activity on several plants
      description: All or nothing. Returns one activity per plant.
      tags: [activities]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-isley-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ActivityCreate"
                - type: object
                  required: [plant_ids]
                  properties:
                    plant_ids:
                      type: array
                      minItems: 1
                      items:
                        type: integer
              unevaluatedProperties: false
      responses:
        "201":
          description: The activities.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
                  next_cursor:
                    type: "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /activities/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getActivity
      summary: Get an activity
      tags: [activities]
      x-isley-scope: read
      responses:
        "200":
          description: The activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      operationId: updateActivity
      summary: Change an activity
      description: |
        Send only the fields to change. `measurements` replaces all of the
        activity's measurements. Moving `at` moves its measurements too.
      tags: [activities]
      x-isley-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                activity_type_id:
                  type: integer
                note:
                  type: string
                  maxLength: 5000
                at:
                  $ref: "#/components/schemas/TimestampInput"
                measurements:
                  type: array
                  items:
                    $ref: "#/components/schemas/MeasurementValue"
      responses:
        "200":
          description: The activity as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
