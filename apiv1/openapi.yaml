  /strains:
    get:
      operationId: listStrains
      summary: Strains
      description: By name, each with its direct parents.
      tags: [strains]
      x-isley-scope: read
      parameters:
        - name: breeder_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: in_stock
          in: query
          description: true for strains with seeds left, false for those without.
          schema:
            type: boolean
        - name: q
          in: query
          description: Part of the name (any case).
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of strains.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Strain"
                  next_cursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createStrain
      summary: Add a strain
      description: |
        Needs `name` and a breeder (`breeder_id` or `breeder_name`).
        `indica_pct` and `sativa_pct` add up to 100; give one and the other
        follows, give neither for 50/50.
      tags: [strains]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      x-isley-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
                indica_pct:
                  type: integer
                  minimum: 0
                  maximum: 100
                sativa_pct:
                  type: integer
                  minimum: 0
                  maximum: 100
                autoflower:
                  type: boolean
                seed_count:
                  type: integer
                  minimum: 0
                cycle_time_days:
                  type: [integer, "null"]
                  minimum: 0
                url:
                  type: string
                  description: http or https; an address without a scheme gets https.
                short_description:
                  type: string
                  maxLength: 2000
                description:
                  type: string
                  maxLength: 5000
                breeder_id:
                  type: integer
                breeder_name:
                  type: string
                  maxLength: 255
                  description: |
                    The breeder by name instead of `breeder_id`: an existing
                    one (ignoring case) or a new one. Wins over `breeder_id`.
      responses:
        "201":
          description: The strain. `Location` is its URL.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /strains/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getStrain
      summary: One strain
      tags: [strains]
      x-isley-scope: read
      responses:
        "200":
          description: The strain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strain"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      operationId: updateStrain
      summary: Change a strain
      description: |
        Changes the fields given. For the seed count prefer
        `POST /strains/{id}/seed-count`, which can't lose a concurrent
        change.
      tags: [strains]
      x-isley-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 255
                indica_pct:
                  type: integer
                  minimum: 0
                  maximum: 100
                sativa_pct:
                  type: integer
                  minimum: 0
                  maximum: 100
                autoflower:
                  type: boolean
                seed_count:
                  type: integer
                  minimum: 0
                cycle_time_days:
                  type: [integer, "null"]
                  minimum: 0
                url:
                  type: string
                  description: http or https; an address without a scheme gets https.
                short_description:
                  type: string
                  maxLength: 2000
                description:
                  type: string
                  maxLength: 5000
                breeder_id:
                  type: integer
                breeder_name:
                  type: string
                  maxLength: 255
                  description: |
                    The breeder by name instead of `breeder_id`: an existing
                    one (ignoring case) or a new one. Wins over `breeder_id`.
      responses:
        "200":
          description: The strain as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteStrain
      summary: Delete a strain
      description: |
        Only a strain with no plants (`409 strain_in_use` otherwise).
        Strains that named it as a parent keep the name, unlinked.
      tags: [strains]
      x-isley-scope: admin
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"

  /strains/{id}/seed-count:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: adjustSeedCount
      summary: Add or take out seeds
      description: |
        Changes the count by `delta` in one step, so two clients adjusting
        at once both count. The count can't go below zero
        (`409 not_enough_seeds`).
      tags: [strains]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
